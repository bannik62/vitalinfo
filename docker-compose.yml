services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vitalinfo-backend
    ports:
      - "${HOST_PORT_BACKEND}:${CONTAINER_PORT_BACKEND}"
    environment:
      - NODE_ENV=production
      - PORT=${CONTAINER_PORT_BACKEND}
      - DB_HOST=mysql
      - DB_PORT=${MYSQL_CONTAINER_PORT}
      - DB_USER=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - DB_NAME=${MYSQL_DATABASE}
    restart: unless-stopped
    networks:
      - vitalinfo-network
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: vitalinfo-mysql
    ports:
      - "${MYSQL_HOST_PORT}:${MYSQL_CONTAINER_PORT}"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - vitalinfo-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: vitalinfo-phpmyadmin
    ports:
      - "${PHPMYADMIN_HOST_PORT}:80"
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=${MYSQL_CONTAINER_PORT}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    restart: unless-stopped
    networks:
      - vitalinfo-network
    depends_on:
      - mysql

networks:
  vitalinfo-network:
    driver: bridge

volumes:
  mysql_data:

