services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vitalinfo-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=Superyoyo62**sql**vitalinfo
      - DB_NAME=vitalinfo
    restart: unless-stopped
    networks:
      - vitalinfo-network
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: vitalinfo-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=Superyoyo62**sql**vitalinfo
      - MYSQL_DATABASE=vitalinfo
      - MYSQL_USER=vitalinfo
      - MYSQL_PASSWORD=Superyoyo62**sql**vitalinfo
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - vitalinfo-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: vitalinfo-phpmyadmin
    ports:
      - "8090:80"
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - PMA_USER=root
      - PMA_PASSWORD=Superyoyo62**sql**vitalinfo
      - MYSQL_ROOT_PASSWORD=Superyoyo62**sql**vitalinfo
    restart: unless-stopped
    networks:
      - vitalinfo-network
    depends_on:
      - mysql

networks:
  vitalinfo-network:
    driver: bridge

volumes:
  mysql_data:

