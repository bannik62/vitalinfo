name: Deploy Prod Frontend
on:
  push:
    branches: [ prod ]
  workflow_dispatch:

jobs:
  deploy-frontend:
    environment: vitalinfo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Variables injectées au build Vite (import.meta.env.VITE_*).
      # GitHub : repo Settings → Secrets and variables → Actions
      #   - Variable VITE_API_BASE_URL (souvent vide si API même domaine)
      #   - Secret VITE_SUPABASE_URL (recommandé si tu ne veux pas la valeur dans le dépôt)
      - name: Install deps and build frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          npm install
          npm run build
        working-directory: frontend

      - name: Ensure target dir exists
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST_VITALINFO }}
          username: ${{ secrets.PROD_SERVER_USER_VITALINFO }}
          key: ${{ secrets.DEPLOY_SSH_KEY_NO_PHRASE_VITALINFO }}
          port: 2222
          script: |
            mkdir -p "${{ secrets.DEPLOY_PATH_VITALINFO }}/frontend"

      - name: Copy Frontend to VPS (scp)
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.VPS_HOST_VITALINFO }}
          username: ${{ secrets.PROD_SERVER_USER_VITALINFO }}
          key: ${{ secrets.DEPLOY_SSH_KEY_NO_PHRASE_VITALINFO }}
          port: 2222
          source: "frontend/dist/**"
          target: "${{ secrets.DEPLOY_PATH_VITALINFO }}/frontend"
          strip_components: 2
          rm: false
